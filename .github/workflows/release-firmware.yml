# Build, sign and attach firmware to a GitHub release: a merged image for a
# first flash over USB, and the app image on its own for OTA updates.
# Modelled on dirkwa/espos-p4-cockpit's release-firmware.yml.
#
# Runs when a release is published, when a v* tag is pushed (the release
# is then created here, as a pre-release), when called with a tag by
# another workflow such as cut-release.yml (a tag or release created with
# the workflow token fires no events), and by hand (assets uploaded as a workflow
# artifact only, named after the commit). Everyday builds are in build.yml.
name: Build & release firmware

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build, sign and attach assets to"
        type: string
        required: true
      prerelease:
        description: "Create the release as a pre-release (when it doesn't exist yet)"
        type: boolean
        default: true
  workflow_dispatch:

# A publishing run is never cancelled: killing an upload half-way leaves a
# release with an incomplete asset set. Runs for the same tag queue instead.
concurrency:
  group: >-
    firmware-${{
      (inputs.tag || github.event.release.tag_name || github.ref_type == 'tag')
      && format('release-{0}', inputs.tag || github.event.release.tag_name || github.ref_name)
      || github.ref
    }}
  cancel-in-progress: ${{ !(inputs.tag || github.event.release.tag_name || github.ref_type == 'tag') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    env:
      # Non-empty for a release; empty for a manual build.
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    outputs:
      unsigned: ${{ steps.signing.outputs.unsigned }}
    steps:
      # fetch-depth 0: ESP-IDF takes the firmware's version from
      # `git describe`, which needs tags; a shallow clone has none and every
      # build would report a bare commit hash.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # A called run's github.ref is the caller's branch; build the tag.
          ref: ${{ inputs.tag || github.ref }}

      # The container runs as root on a checkout owned by the runner user;
      # without this git refuses to describe it and the version is lost.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Releases must be signed with the project's real key: a device only
      # accepts OTA images signed with the key it was first flashed with. Fail
      # rather than fall back, because a release signed with a throwaway key
      # installs fine over USB and then rejects every future OTA.
      - name: Restore signing key (releases)
        id: signing
        if: env.RELEASE_TAG != ''
        env:
          KEY: ${{ secrets.SIGNING_KEY_PEM }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -z "$KEY" ] && [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::ALLOW_UNSIGNED_RELEASE is set: building with a" \
                 "throwaway signing key. USB flashing works; OTA updates will NOT."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEY" ]; then
            echo "::error::SIGNING_KEY_PEM is not set. Releases are signed so" \
                 "devices can verify OTA updates. Generate a production key and" \
                 "add it as a repository secret:"
            echo "::error::  espsecure generate-signing-key --version 2 --scheme rsa3072 signing_key.pem"
            echo "::error::  gh secret set SIGNING_KEY_PEM < signing_key.pem"
            echo "::error::Keep that file safe: losing it means no device flashed" \
                 "with this release can take another OTA."
            echo "::error::To release for USB flashing only, set repository" \
                 "variable ALLOW_UNSIGNED_RELEASE=true."
            exit 1
          fi
          printf '%s' "$KEY" > secure_boot_signing_key.pem
          # Catch a truncated or mangled secret before a long build.
          openssl rsa -in secure_boot_signing_key.pem -noout -check

      - name: Build for esp32s3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Manual builds and ALLOW_UNSIGNED releases get a throwaway key.
          if [ ! -f secure_boot_signing_key.pem ]; then
            espsecure generate-signing-key --version 2 --scheme rsa3072 secure_boot_signing_key.pem
          fi
          idf.py set-target esp32s3
          idf.py build

      # --require storage: an image merged without the web UI partition still
      # boots, but serves espOS's placeholder page instead of the settings UI.
      - name: Merge flash images into one binary
        shell: bash
        run: |
          python3 -m venv /tmp/esptool
          /tmp/esptool/bin/pip install --quiet "esptool==4.8.1"
          PATH=/tmp/esptool/bin:$PATH python3 scripts/espos_merge_firmware.py \
            --build-dir build --chip esp32s3 --out merged.bin --require storage

      - name: Verify merged binary
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          data = Path("merged.bin").read_bytes()
          files = json.loads(Path("build/flasher_args.json").read_text())["flash_files"]
          print(f"{len(data)} bytes ({len(data)/1024/1024:.2f} MiB)")
          # The ESP32-S3 bootloader sits at 0x0 and starts with image magic 0xE9.
          if data[0] != 0xE9:
              sys.exit(f"error: no ESP image magic at 0x0 (got {data[0]:#04x})")
          storage = [int(off, 16) for off, f in files.items() if "storage" in f]
          if not storage:
              sys.exit("error: the build has no storage (web UI) partition")
          at = storage[0]
          if len(data) <= at or data[at:at + 0x1000] == b"\xff" * 0x1000:
              sys.exit(f"error: storage partition at {at:#x} missing or blank")
          print("merged image looks structurally sound")
          PY

      # Both files in one flat directory: upload-artifact strips paths to
      # their common ancestor. The OTA image is what a device fetches; the
      # merged image is for a cable.
      - name: Stage assets
        shell: bash
        env:
          # Via env, not an expression: a tag name is arbitrary text.
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG:-$(git describe --tags --always)}"
          case "$VERSION" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing unsafe version '$VERSION'"; exit 1 ;;
          esac
          APP="$(python3 -c 'import json; print(json.load(open("build/flasher_args.json"))["app"]["file"])')"
          mkdir -p dist
          cp merged.bin    "dist/signalk-espOS-8relay-${VERSION}-merged.bin"
          cp "build/$APP"  "dist/signalk-espOS-8relay-${VERSION}-ota.bin"
          # Debug symbols: the only way to decode a crash backtrace or core
          # dump from this exact build.
          cp "build/${APP%.bin}.elf" "dist/signalk-espOS-8relay-${VERSION}.elf"
          ls -l dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware
          path: dist/

  release:
    if: inputs.tag != '' || github.event_name == 'release' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialises releases, because the mirror step below pushes one shared
    # branch. Optimisation, not the safety guarantee -- see that step's
    # force-with-lease push -- but it keeps the common case from needing a
    # retry at all.
    concurrency:
      group: release-assets-${{ github.repository }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      # A pushed tag, or a tag from cut-release.yml, has no release yet.
      # Only after a successful build, so a failed build never leaves an
      # empty release behind. A pre-release unless cut-release.yml was run
      # with "Publish as a pre-release" unticked.
      - name: Create the release if it doesn't exist
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          # Empty for a pushed tag (inputs don't exist there): pre-release.
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          # Notes from the version's CHANGELOG.md entry; GitHub's generated
          # list only for a tag pushed without one.
          if scripts/changelog_section.sh "$TAG" > notes.md; then
            # The version's link from the bottom of CHANGELOG.md, e.g. its
            # compare view against the previous release.
            link=$(sed -n "s/^\[${TAG#v}\]: //p" CHANGELOG.md | head -1)
            if [ -n "$link" ]; then
              printf '\n**Full Changelog**: %s\n' "$link" >> notes.md
            fi
            notes=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md has no entry for $TAG; using generated notes"
            notes=(--generate-notes)
          fi
          # A pushed tag is always a pre-release; a called run says.
          pre=(--prerelease)
          if [ "$PRERELEASE" = "false" ]; then
            pre=()
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${pre[@]}" --title "$TAG" "${notes[@]}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: dist

      # An unsigned release says so where people download it, above the
      # release notes, not only in a CI log.
      - name: Prepend the unsigned-build warning
        if: needs.build.outputs.unsigned == 'true'
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Fail closed: an API error must not replace the notes with just
          # the warning.
          if ! existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>&1); then
            echo "::error::could not read the release body for $TAG: $existing"
            exit 1
          fi
          # Random delimiter: the body is arbitrary text.
          delim="RELEASE_BODY_$(openssl rand -hex 8)"
          {
            echo "body<<${delim}"
            echo '> [!WARNING]'
            echo '> **Unsigned build: USB flashing only.** Built without a signing'
            echo '> key (`ALLOW_UNSIGNED_RELEASE`), so a device flashed with it will'
            echo '> reject every OTA update, including later releases. Flash over'
            echo '> USB, or set `SIGNING_KEY_PEM` and re-release.'
            echo ''
            printf '%s\n' "$existing"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: refuse an image too large to mirror
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.bin; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 52428800 ]; then
              echo "::error::$(basename "$f") is $size bytes; too large to serve" \
                   "from raw.githubusercontent. The flasher would 404."
              exit 1
            fi
          done
          echo "all images are within the size raw.githubusercontent serves"

      # Publish the same images somewhere a BROWSER may read them, for the
      # espOS firmware registry's webAssetsBranch (signalk-espOS/registry).
      #
      # GitHub serves release downloads with no Access-Control-Allow-Origin,
      # on the 302 and on the redirect target, so a web page cannot fetch
      # them at all. raw.githubusercontent does send
      # `access-control-allow-origin: *` and honours Range requests, so an
      # orphan branch of this repository works as a CORS-readable mirror of
      # what the release already carries.
      #
      # The branch is a publishing surface, not history: it carries one
      # directory per tag and is rewritten as a single commit each time.
      # Modelled on dirkwa/espos-p4-cockpit's release-firmware.yml.
      - name: mirror the images where a browser can read them
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work="${RUNNER_TEMP}/release-assets-work"
          rm -rf "$work"; mkdir -p "$work"
          staged=$PWD/dist

          {
            echo "# Browser-readable firmware"
            echo
            echo "Generated by \`release-firmware.yml\`; do not edit or merge."
            echo
            echo "These are the same images attached to release \`$TAG\`,"
            echo "republished here because GitHub serves release downloads"
            echo "without the CORS header a web page needs to read them. The"
            echo "espOS firmware registry's hosted flasher fetches them from"
            echo "raw.githubusercontent.com, which does send it."
            echo
            echo "Force-pushed on every release. Holds the current release plus"
            echo "the two before it; older directories are pruned. The releases"
            echo "themselves remain the archive, so firmware pruned from here"
            echo "is still downloadable from its release."
          } > "${RUNNER_TEMP}/release-assets-README.md"

          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          cd "$work"
          git init -q -b release-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only exit 2 means "no such branch"; anything else means the
          # remote could not be reached, and force-pushing now would delete
          # every other release's images to publish this one.
          set +e
          git ls-remote --exit-code --heads "$remote" release-assets >/dev/null 2>&1
          lsr=$?
          set -e
          base=""
          case "$lsr" in
            0)
              echo "release-assets exists; restoring it before adding $TAG"
              git fetch -q --depth 1 "$remote" release-assets
              git checkout -q FETCH_HEAD -- .
              base=$(git rev-parse FETCH_HEAD)
              ;;
            2)
              echo "release-assets does not exist yet; creating it"
              ;;
            *)
              echo "::error::could not reach ${REPO} to read release-assets" \
                   "(git ls-remote exited $lsr). Refusing to publish, because" \
                   "force-pushing now would delete the other releases' images."
              exit 1
              ;;
          esac

          # Re-stage this tag's images over whatever was there, so re-running
          # a release replaces its own directory and leaves the others
          # alone. A function because the retry loop below has to redo this
          # exactly, from the new tip, after a lease rejection.
          stage_tag() {
            cp "${RUNNER_TEMP}/release-assets-README.md" ./README.md
            rm -rf -- "${TAG:?}"
            mkdir -p "$TAG"
            cp "$staged"/*.bin "$TAG/"
            # Keep the branch bounded: the newest KEEP tags by VERSION
            # order, always including the one this run publishes (a
            # re-published old tag must not prune the directory it just
            # wrote).
            local old others
            mapfile -t others < <(
              find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' \
                | grep -Fxv -- "$TAG" | sort -rV
            )
            local KEEP=3
            for old in "${others[@]:$((KEEP - 1))}"; do
              echo "pruning $old"
              rm -rf -- "$old"
            done
          }
          stage_tag

          # --force-with-lease, not --force: the concurrency group above
          # keeps two runs from pushing at once, but GitHub holds at most
          # one pending job per group, so a third release entering the
          # queue cancels the second rather than queuing it. The lease
          # makes the push itself safe regardless: if the branch moved
          # under us the push is rejected rather than discarding the other
          # run's tag, and we redo the fetch/stage from the new tip.
          stage_and_push() {
            git add -A
            git commit -q -m "firmware for $TAG"
            if [ -n "$base" ]; then
              git push -q --force-with-lease="release-assets:${base}" \
                "$remote" HEAD:release-assets
            else
              git push -q --force-with-lease="release-assets:" \
                "$remote" HEAD:release-assets
            fi
          }

          attempt=1
          until stage_and_push; do
            remote_tip=$(git ls-remote "$remote" refs/heads/release-assets 2>/dev/null \
                           | cut -f1)
            if [ -z "$remote_tip" ]; then
              echo "::error::the push failed and release-assets could not be" \
                   "read afterwards, so this is not a lease rejection." \
                   "Refusing to retry."
              exit 1
            fi
            if [ "$remote_tip" = "$base" ]; then
              echo "::error::the push failed but release-assets is still at" \
                   "${remote_tip} -- nothing moved, so this is not a lease" \
                   "rejection. Check the log above for the real reason (auth," \
                   "network, a protected branch)."
              exit 1
            fi
            if [ "$remote_tip" = "$(git rev-parse HEAD)" ]; then
              echo "release-assets is already at this run's commit; treating" \
                   "the push as successful."
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::release-assets moved under this run 3 times;" \
                   "giving up rather than discarding another release's images."
              exit 1
            fi
            echo "::warning::release-assets moved since this run read it" \
                 "(now ${remote_tip}, attempt $attempt); re-reading and re-staging."
            attempt=$((attempt + 1))
            git checkout -q --orphan "rebuild-$attempt"
            git rm -rq --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
            git fetch -q --depth 1 "$remote" release-assets
            git checkout -q FETCH_HEAD -- .
            base=$(git rev-parse FETCH_HEAD)
            stage_tag
          done

          echo "published $TAG to the release-assets branch:"
          for f in "$TAG"/*.bin; do
            echo "  https://raw.githubusercontent.com/${REPO}/release-assets/${TAG}/$(basename "$f")"
          done

          # For the rollback step below: what to push back to if a later
          # step in this job fails.
          echo "MIRROR_BASE=${base}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.bin
            dist/*.elf
          body: ${{ steps.notes.outputs.body }}

      # Any failure after the mirror pushed: the branch would otherwise be
      # left advertising a tag whose release has no assets (or has stale
      # ones from a partial upload). Restore what it held before this run.
      - name: roll back the mirror on failure
        if: failure() && env.MIRROR_BASE != ''
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git init -q -b rollback /tmp/mirror-rollback
          cd /tmp/mirror-rollback
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 "$remote" "$MIRROR_BASE"
          git push -q --force "$remote" "${MIRROR_BASE}:refs/heads/release-assets"
          echo "restored release-assets to its pre-run state ($MIRROR_BASE)"

  # Publish the build in the OTA manifest espOS boards check for updates
  # (USER_MANUAL §3.3): manifest.json on the `ota` branch, served at
  # https://raw.githubusercontent.com/<repo>/ota/manifest.json. A full
  # release goes on the stable and beta channels, a pre-release on beta.
  # Never an unsigned build: it carries a throwaway key no board accepts, so
  # every board would find it, download it and reject it.
  manifest:
    if: >-
      (inputs.tag != '' || github.event_name == 'release' || github.ref_type == 'tag')
      && needs.build.outputs.unsigned != 'true'
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One manifest update at a time, never cancelled half-way.
    concurrency:
      group: ota-manifest
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware
          path: dist

      - name: Add the build to the manifest on the ota branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          # Ask GitHub, so a release published by hand counts too.
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          flag=()
          if [ "$pre" = "true" ]; then flag=(--prerelease); fi
          # The version's one-line summary (checked by cut-release.yml); for a
          # tag pushed without one, the first bullet, joined onto one line.
          if ! notes=$(scripts/changelog_summary.sh "$TAG" 2>/dev/null); then
            notes=$(scripts/changelog_section.sh "$TAG" 2>/dev/null \
              | awk '/^- /{if(f)exit; f=1; sub(/^- /,"")} f&&/^$/{exit} f{printf "%s ", $0}' \
              | sed 's/  */ /g; s/ $//' || true)
          fi
          image="dist/signalk-espOS-8relay-${TAG}-ota.bin"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/signalk-espOS-8relay-${TAG}-ota.bin"

          git init -q ota
          cd ota
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # No ota branch yet on the first release: git says "couldn't find
          # remote ref", which is expected, so keep it out of the log.
          if git fetch -q --depth 1 origin ota 2>/dev/null; then
            git checkout -q -b ota FETCH_HEAD
          else
            git checkout -q --orphan ota
            printf '%s\n' "# OTA manifest" "" \
              "Written by the release workflow; don't edit by hand. espOS boards" \
              "check manifest.json for updates (USER_MANUAL.md section 3.3 on main)." > README.md
          fi
          python3 ../scripts/update_ota_manifest.py --manifest manifest.json \
            --version "$TAG" --url "$url" --image "../$image" --notes "$notes" "${flag[@]}"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "OTA manifest: ${TAG}$([ "$pre" = "true" ] && echo ' (beta)')"
          git push -q origin ota
